pacity:0.35}1.20%{opacity:0.35}16.67%{opacity:0.35}17.87%{opacity:0.35}33.33%{opacity:0.35}34.53%{opacity:0.35}50.00%{opacity:0.35}51.20%{opacity:1}66.67%{opacity:1}67.87%{opacity:1}83.33%{opacity:1}84.53%{opacity:0.35}100.00%{opacity:0.35}}#b-agt{animation:bagt 33s linear infinite}@keyframes bagt{0%{opacity:0.35}1.20%{opacity:0.35}16.67%{opacity:0.35}17.87%{opacity:0.35}33.33%{opacity:0.35}34.53%{opacity:0.35}50.00%{opacity:0.35}51.20%{opacity:0.35}66.67%{opacity:0.35}67.87%{opacity:1}83.33%{opacity:1}84.53%{opacity:0.35}100.00%{opacity:0.35}}#b-dsk{animation:bdsk 33s linear infinite}@keyframes bdsk{0%{opacity:1}1.20%{opacity:0.35}16.67%{opacity:0.35}17.87%{opacity:0.35}33.33%{opacity:0.35}34.53%{opacity:0.35}50.00%{opacity:0.35}51.20%{opacity:0.35}66.67%{opacity:0.35}67.87%{opacity:0.35}83.33%{opacity:0.35}84.53%{opacity:1}100.00%{opacity:1}}#c0{animation:c0 33s linear infinite}@keyframes c0{0%{opacity:0}1.20%{opacity:1}16.67%{opacity:1}17.87%{opacity:0}33.33%{opacity:0}34.53%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}66.67%{opacity:0}67.87%{opacity:0}83.33%{opacity:0}84.53%{opacity:0}100.00%{opacity:0}}#c1{animation:c1 33s linear infinite}@keyframes c1{0%{opacity:0}1.20%{opacity:0}16.67%{opacity:0}17.87%{opacity:1}33.33%{opacity:1}34.53%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}66.67%{opacity:0}67.87%{opacity:0}83.33%{opacity:0}84.53%{opacity:0}100.00%{opacity:0}}#c2{animation:c2 33s linear infinite}@keyframes c2{0%{opacity:0}1.20%{opacity:0}16.67%{opacity:0}17.87%{opacity:0}33.33%{opacity:0}34.53%{opacity:1}50.00%{opacity:1}51.20%{opacity:0}66.67%{opacity:0}67.87%{opacity:0}83.33%{opacity:0}84.53%{opacity:0}100.00%{opacity:0}}#c3{animation:c3 33s linear infinite}@keyframes c3{0%{opacity:0}1.20%{opacity:0}16.67%{opacity:0}17.87%{opacity:0}33.33%{opacity:0}34.53%{opacity:0}50.00%{opacity:0}51.20%{opacity:1}66.67%{opacity:1}67.87%{opacity:0}83.33%{opacity:0}84.53%{opacity:0}100.00%{opacity:0}}#c4{animation:c4 33s linear infinite}@keyframes c4{0%{opacity:0}1.20%{opacity:0}16.67%{opacity:0}17.87%{opacity:0}33.33%{opacity:0}34.53%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}66.67%{opacity:0}67.87%{opacity:1}83.33%{opacity:1}84.53%{opacity:0}100.00%{opacity:0}}#c5{animation:c5 33s linear infinite}@keyframes c5{0%{opacity:1}1.20%{opacity:0}16.67%{opacity:0}17.87%{opacity:0}33.33%{opacity:0}34.53%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}66.67%{opacity:0}67.87%{opacity:0}83.33%{opacity:0}84.53%{opacity:1}100.00%{opacity:1}}</style><rect width="680" height="492" rx="12" fill="var(--bg)"/><rect x="160" y="20" width="300" height="312" rx="16" fill="none" stroke="var(--line)" stroke-dasharray="6 5"/><text class="h" x="310" y="42" text-anchor="middle" dominant-baseline="central">Оперативная память процесса</text><path class="a" marker-end="url(#m)" d="M130 84H176"/><path class="a" marker-end="url(#m)" d="M440 84H496"/><path class="a" marker-end="url(#m)" d="M500 112L470 136H444"/><path class="a" marker-end="url(#m)" d="M440 188H496"/><path class="a" marker-end="url(#m)" d="M440 240H470V204H496"/><path class="a" marker-end="url(#m)" d="M580 226V266"/><path class="a" marker-end="url(#m)" d="M310 332V348"/><g id="b-in"><rect x="20" y="56" width="110" height="56" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="75.0" y="74.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Запись</text><text class="s" x="75.0" y="94.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">write()</text></g><g id="b-ent"><rect x="180" y="62" width="260" height="44" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="196" y="84.0" dominant-baseline="central" style="fill:var(--teal3)">_entries</text><text class="s" x="424" y="84.0" text-anchor="end" dominant-baseline="central" style="fill:var(--teal2)">dict, все записи</text></g><g id="b-ver"><rect x="180" y="114" width="260" height="44" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="196" y="136.0" dominant-baseline="central" style="fill:var(--teal3)">_versions</text><text class="s" x="424" y="136.0" text-anchor="end" dominant-baseline="central" style="fill:var(--teal2)">dict, версии фактов</text></g><g id="b-con"><rect x="180" y="166" width="260" height="44" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="196" y="188.0" dominant-baseline="central" style="fill:var(--teal3)">_constraints</text><text class="s" x="424" y="188.0" text-anchor="end" dominant-baseline="central" style="fill:var(--teal2)">list, запреты</text></g><g id="b-fra"><rect x="180" y="218" width="260" height="44" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="196" y="240.0" dominant-baseline="central" style="fill:var(--teal3)">_fragments</text><text class="s" x="424" y="240.0" text-anchor="end" dominant-baseline="central" style="fill:var(--teal2)">list, данные</text></g><g id="b-qua"><rect x="180" y="270" width="260" height="44" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="196" y="292.0" dominant-baseline="central" style="fill:var(--teal3)">quarantined</text><text class="s" x="424" y="292.0" text-anchor="end" dominant-baseline="central" style="fill:var(--teal2)">list, карантин</text></g><g id="b-mod"><rect x="500" y="56" width="160" height="56" rx="8" fill="var(--amber)" stroke="var(--amber2)" stroke-width=".6"/><text class="h" x="580.0" y="74.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--amber3)">Модель Haiku</text><text class="s" x="580.0" y="94.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--amber2)">извлекает факты</text></g><g id="b-ctx"><rect x="500" y="170" width="160" height="56" rx="8" fill="var(--purple)" stroke="var(--purple2)" stroke-width=".6"/><text class="h" x="580.0" y="188.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple3)">Контекст</text><text class="s" x="580.0" y="208.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple2)">до 2000 токенов</text></g><g id="b-agt"><rect x="500" y="270" width="160" height="56" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="580.0" y="288.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Агент</text><text class="s" x="580.0" y="308.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">читает контекст</text></g><g id="b-dsk"><rect x="160" y="352" width="300" height="52" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="310.0" y="368.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Диск: JSON и JSONL</text><text class="s" x="310.0" y="388.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">только итоги и трассы</text></g><circle id="dot" r="7" fill="#d85a30"/><g id="c0"><text class="n" x="20" y="432">Шаг 1 из 6</text><text class="c" x="20" y="454">Запись приходит в write() и сразу кладётся в словарь _entries.</text><text class="c" x="20" y="474">Модель не вызывается, новые записи пока не видны как факты.</text></g><g id="c1"><text class="n" x="20" y="432">Шаг 2 из 6</text><text class="c" x="20" y="454">В конце сессии end_session передаёт новые записи экстрактору.</text><text class="c" x="20" y="474">Это обычный вызов модели, он возвращает факты с датой и источником.</text></g><g id="c2"><text class="n" x="20" y="432">Шаг 3 из 6</text><text class="c" x="20" y="454">Результат раскладывается по структурам: версии фактов, запреты из доверенных</text><text class="c" x="20" y="474">записей, данные из документов и карантин для строк, похожих на инструкции.</text></g><g id="c3"><text class="n" x="20" y="432">Шаг 4 из 6</text><text class="c" x="20" y="454">При чтении context() заново собирает контекст: видимость, разрешение конфликтов,</text><text class="c" x="20" y="474">поиск BM25. Модель не нужна, карантин в контекст не попадает.</text></g><g id="c4"><text class="n" x="20" y="432">Шаг 5 из 6</text><text class="c" x="20" y="454">Агент получает готовый текст до 2000 токенов.</text><text class="c" x="20" y="474">Сам он ничего не помнит между вызовами.</text></g><g id="c5"><text class="n" x="20" y="432">Шаг 6 из 6</text><text class="c" x="20" y="454">Единица прогона закончилась: объект памяти исчезает вместе с содержимым.</text><text class="c" x="20" y="474">На диск идут только итоги и трассы, из них память не восстанавливается.</text></g></svg>
