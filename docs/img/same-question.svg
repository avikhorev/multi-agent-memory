<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" aria-label="Анимация: что три системы кладут в контекст на один вопрос"><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="md" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#d85a30" stroke-width="1.5" stroke-linecap="round"/></marker></defs><style>:root{--bg:#fff;--line:#73726c;--t:#1f1e1d;--s:#5f5e5a;--gray:#f1efe8;--gray2:#5f5e5a;--gray3:#444441;--teal:#e1f5ee;--teal2:#0f6e56;--teal3:#085041;--amber:#faeeda;--amber2:#854f0b;--amber3:#633806;--purple:#eeedfe;--purple2:#534ab7;--purple3:#3c3489;--coral:#faece7;--coral2:#993c1d;--coral3:#712b13;--dir:#d85a30}@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--line:#9c9a92;--t:#f4f3ee;--s:#c2c0b6;--gray:#444441;--gray2:#b4b2a9;--gray3:#f1efe8;--teal:#085041;--teal2:#5dcaa5;--teal3:#e1f5ee;--amber:#633806;--amber2:#ef9f27;--amber3:#faeeda;--purple:#3c3489;--purple2:#afa9ec;--purple3:#eeedfe;--coral:#712b13;--coral2:#f0997b;--coral3:#faece7;--dir:#f0997b}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--t)}.a{stroke:var(--line);stroke-width:1.2;fill:none}.d{stroke:var(--dir);stroke-width:2;fill:none;stroke-dasharray:6 4}.h{font-size:14px;font-weight:600}.s{font-size:12px;fill:var(--s)}.c{font-size:14px}.n{font-size:12px;fill:var(--s)}.q{font-size:12px}#dot{animation:d 27.5s ease-in-out infinite}@keyframes d{0%{transform:translate(20px,126px)}2.50%{transform:translate(20px,126px)}20.00%{transform:translate(20px,126px)}22.50%{transform:translate(20px,126px)}40.00%{transform:translate(20px,126px)}42.50%{transform:translate(20px,238px)}60.00%{transform:translate(20px,238px)}62.50%{transform:translate(20px,350px)}80.00%{transform:translate(20px,350px)}82.50%{transform:translate(20px,126px)}97.50%{transform:translate(20px,126px)}100%{transform:translate(20px,126px)}}#r0l{animation:l0 27.5s linear infinite}@keyframes l0{0%{opacity:1}1.20%{opacity:0.35}20.00%{opacity:0.35}21.20%{opacity:1}40.00%{opacity:1}41.20%{opacity:0.35}60.00%{opacity:0.35}61.20%{opacity:0.35}80.00%{opacity:0.35}81.20%{opacity:1}100.00%{opacity:1}}#r0{animation:l1 27.5s linear infinite}@keyframes l1{0%{opacity:1}1.20%{opacity:0.0}20.00%{opacity:0.0}21.20%{opacity:1}40.00%{opacity:1}41.20%{opacity:1}60.00%{opacity:1}61.20%{opacity:1}80.00%{opacity:1}81.20%{opacity:1}100.00%{opacity:1}}#r1l{animation:l2 27.5s linear infinite}@keyframes l2{0%{opacity:1}1.20%{opacity:0.35}20.00%{opacity:0.35}21.20%{opacity:0.35}40.00%{opacity:0.35}41.20%{opacity:1}60.00%{opacity:1}61.20%{opacity:0.35}80.00%{opacity:0.35}81.20%{opacity:1}100.00%{opacity:1}}#r1{animation:l3 27.5s linear infinite}@keyframes l3{0%{opacity:1}1.20%{opacity:0.0}20.00%{opacity:0.0}21.20%{opacity:0.0}40.00%{opacity:0.0}41.20%{opacity:1}60.00%{opacity:1}61.20%{opacity:1}80.00%{opacity:1}81.20%{opacity:1}100.00%{opacity:1}}#r2l{animation:l4 27.5s linear infinite}@keyframes l4{0%{opacity:1}1.20%{opacity:0.35}20.00%{opacity:0.35}21.20%{opacity:0.35}40.00%{opacity:0.35}41.20%{opacity:0.35}60.00%{opacity:0.35}61.20%{opacity:1}80.00%{opacity:1}81.20%{opacity:1}100.00%{opacity:1}}#r2{animation:l5 27.5s linear infinite}@keyframes l5{0%{opacity:1}1.20%{opacity:0.0}20.00%{opacity:0.0}21.20%{opacity:0.0}40.00%{opacity:0.0}41.20%{opacity:0.0}60.00%{opacity:0.0}61.20%{opacity:1}80.00%{opacity:1}81.20%{opacity:1}100.00%{opacity:1}}#c0{animation:c0 27.5s linear infinite}@keyframes c0{0%{opacity:0}1.20%{opacity:1}20.00%{opacity:1}21.20%{opacity:0}40.00%{opacity:0}41.20%{opacity:0}60.00%{opacity:0}61.20%{opacity:0}80.00%{opacity:0}81.20%{opacity:0}100.00%{opacity:0}}#c1{animation:c1 27.5s linear infinite}@keyframes c1{0%{opacity:0}1.20%{opacity:0}20.00%{opacity:0}21.20%{opacity:1}40.00%{opacity:1}41.20%{opacity:0}60.00%{opacity:0}61.20%{opacity:0}80.00%{opacity:0}81.20%{opacity:0}100.00%{opacity:0}}#c2{animation:c2 27.5s linear infinite}@keyframes c2{0%{opacity:0}1.20%{opacity:0}20.00%{opacity:0}21.20%{opacity:0}40.00%{opacity:0}41.20%{opacity:1}60.00%{opacity:1}61.20%{opacity:0}80.00%{opacity:0}81.20%{opacity:0}100.00%{opacity:0}}#c3{animation:c3 27.5s linear infinite}@keyframes c3{0%{opacity:0}1.20%{opacity:0}20.00%{opacity:0}21.20%{opacity:0}40.00%{opacity:0}41.20%{opacity:0}60.00%{opacity:0}61.20%{opacity:1}80.00%{opacity:1}81.20%{opacity:0}100.00%{opacity:0}}#c4{animation:c4 27.5s linear infinite}@keyframes c4{0%{opacity:1}1.20%{opacity:0}20.00%{opacity:0}21.20%{opacity:0}40.00%{opacity:0}41.20%{opacity:0}60.00%{opacity:0}61.20%{opacity:0}80.00%{opacity:0}81.20%{opacity:1}100.00%{opacity:1}}</style><rect width="680" height="500" rx="12" fill="var(--bg)"/><text class="h" x="20" y="30" text-anchor="start" dominant-baseline="central">Вопрос: What is the current tech lead for the reporting module?</text><text class="s" x="20" y="54" text-anchor="start" dominant-baseline="central">Старое значение: Greta Adeyemi. Новое: Pavel Dubois. Реальный вывод систем.</text><g id="r0l"><rect x="20" y="76" width="150" height="100" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="95.0" y="115.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--teal3)">ours</text><text class="s" x="95.0" y="137.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--teal2)">231 токен</text></g><g id="r0"><rect x="180" y="76" width="480" height="100" rx="8" fill="none" stroke="var(--line)" stroke-width=".8"/><text class="q" x="194" y="96" text-anchor="start" dominant-baseline="central">Atlas/reporting tech_lead: Pavel Dubois</text><text class="s" x="194" y="160" text-anchor="start" dominant-baseline="central" style="font-weight:600;fill:var(--teal2)">Старое значение в контексте: нет</text></g><g id="r1l"><rect x="20" y="188" width="150" height="100" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="95.0" y="227.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">full_history</text><text class="s" x="95.0" y="249.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">1036 токенов</text></g><g id="r1"><rect x="180" y="188" width="480" height="100" rx="8" fill="none" stroke="var(--line)" stroke-width=".8"/><text class="q" x="194" y="208" text-anchor="start" dominant-baseline="central">Status update. … the tech lead is Greta Adeyemi. …</text><text class="q" x="194" y="230" text-anchor="start" dominant-baseline="central">Reviewer note: Tech lead … stands at Greta Adeyemi.</text><text class="q" x="194" y="252" text-anchor="start" dominant-baseline="central">Change of plan: … tech lead Pavel Dubois instead of Greta Adeyemi.</text><text class="s" x="194" y="272" text-anchor="start" dominant-baseline="central" style="font-weight:600;fill:var(--coral2)">Старое значение в контексте: да</text></g><g id="r2l"><rect x="20" y="300" width="150" height="100" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="95.0" y="339.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">shared_rag_bm25</text><text class="s" x="95.0" y="361.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">1036 токенов</text></g><g id="r2"><rect x="180" y="300" width="480" height="100" rx="8" fill="none" stroke="var(--line)" stroke-width=".8"/><text class="q" x="194" y="320" text-anchor="start" dominant-baseline="central">Reviewer note: Tech lead … stands at Greta Adeyemi.</text><text class="q" x="194" y="342" text-anchor="start" dominant-baseline="central">Change of plan: … tech lead Pavel Dubois instead of Greta Adeyemi.</text><text class="q" x="194" y="364" text-anchor="start" dominant-baseline="central">Status update. … the tech lead is Greta Adeyemi. …</text><text class="s" x="194" y="384" text-anchor="start" dominant-baseline="central" style="font-weight:600;fill:var(--coral2)">Старое значение в контексте: да</text></g><circle id="dot" r="7" fill="#d85a30"/><g id="c0"><text class="n" x="20" y="438">Шаг 1 из 5</text><text class="c" x="20" y="460">Один вопрос Planner в сессии 7 сценария C1-eval-0012, проверка cpx-1.</text><text class="c" x="20" y="480">Память собрана из записей сессий 1-6 теми же функциями, что в прогоне.</text></g><g id="c1"><text class="n" x="20" y="438">Шаг 2 из 5</text><text class="c" x="20" y="460">Контекст ours: 20 строк, 231 токен. О tech lead в нём одна строка,</text><text class="c" x="20" y="480">действующее значение Pavel Dubois. Старого значения нет.</text></g><g id="c2"><text class="n" x="20" y="438">Шаг 3 из 5</text><text class="c" x="20" y="460">full_history кладёт все записи, 1036 токенов, лимит 2000 не достигнут.</text><text class="c" x="20" y="480">Старое и новое значение рядом, в записи об обновлении старое названо снова.</text></g><g id="c3"><text class="n" x="20" y="438">Шаг 4 из 5</text><text class="c" x="20" y="460">shared_rag_bm25 вернул тот же набор записей в другом порядке, тоже 1036 токенов.</text><text class="c" x="20" y="480">Лимита хватило на все записи, поэтому отбор ничего не отсёк.</text></g><g id="c4"><text class="n" x="20" y="438">Шаг 5 из 5</text><text class="c" x="20" y="460">Итог для C1-eval-0012: оба значения есть у full_history и shared_rag_bm25,</text><text class="c" x="20" y="480">у ours только текущее. Это один сценарий, а не оценка систем.</text></g></svg>
