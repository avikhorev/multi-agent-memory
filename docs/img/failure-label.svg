<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img" aria-label="Анимация: цепочка, по которой выводится метка провала контрольной точки"><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="md" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#d85a30" stroke-width="1.5" stroke-linecap="round"/></marker></defs><style>:root{--bg:#fff;--line:#73726c;--t:#1f1e1d;--s:#5f5e5a;--gray:#f1efe8;--gray2:#5f5e5a;--gray3:#444441;--teal:#e1f5ee;--teal2:#0f6e56;--teal3:#085041;--amber:#faeeda;--amber2:#854f0b;--amber3:#633806;--purple:#eeedfe;--purple2:#534ab7;--purple3:#3c3489;--coral:#faece7;--coral2:#993c1d;--coral3:#712b13;--dir:#d85a30}@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--line:#9c9a92;--t:#f4f3ee;--s:#c2c0b6;--gray:#444441;--gray2:#b4b2a9;--gray3:#f1efe8;--teal:#085041;--teal2:#5dcaa5;--teal3:#e1f5ee;--amber:#633806;--amber2:#ef9f27;--amber3:#faeeda;--purple:#3c3489;--purple2:#afa9ec;--purple3:#eeedfe;--coral:#712b13;--coral2:#f0997b;--coral3:#faece7;--dir:#f0997b}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--t)}.a{stroke:var(--line);stroke-width:1.2;fill:none}.d{stroke:var(--dir);stroke-width:2;fill:none;stroke-dasharray:6 4}.h{font-size:14px;font-weight:600}.s{font-size:12px;fill:var(--s)}.c{font-size:14px}.n{font-size:12px;fill:var(--s)}.q{font-size:12px}#dot{animation:d 22.0s ease-in-out infinite}@keyframes d{0%{transform:translate(20px,64px)}2.50%{transform:translate(20px,64px)}25.00%{transform:translate(20px,64px)}27.50%{transform:translate(20px,188px)}50.00%{transform:translate(20px,188px)}52.50%{transform:translate(20px,250px)}75.00%{transform:translate(20px,250px)}77.50%{transform:translate(400px,188px)}97.50%{transform:translate(400px,188px)}100%{transform:translate(20px,64px)}}#r0{animation:l0 22.0s linear infinite}@keyframes l0{0%{opacity:0.35}1.20%{opacity:1}25.00%{opacity:1}26.20%{opacity:0.35}50.00%{opacity:0.35}51.20%{opacity:0.35}75.00%{opacity:0.35}76.20%{opacity:0.35}100.00%{opacity:0.35}}#r1{animation:l1 22.0s linear infinite}@keyframes l1{0%{opacity:0.35}1.20%{opacity:1}25.00%{opacity:1}26.20%{opacity:0.35}50.00%{opacity:0.35}51.20%{opacity:0.35}75.00%{opacity:0.35}76.20%{opacity:0.35}100.00%{opacity:0.35}}#r2{animation:l2 22.0s linear infinite}@keyframes l2{0%{opacity:1}1.20%{opacity:0.35}25.00%{opacity:0.35}26.20%{opacity:1}50.00%{opacity:1}51.20%{opacity:0.35}75.00%{opacity:0.35}76.20%{opacity:1}100.00%{opacity:1}}#r3{animation:l3 22.0s linear infinite}@keyframes l3{0%{opacity:0.35}1.20%{opacity:0.35}25.00%{opacity:0.35}26.20%{opacity:0.35}50.00%{opacity:0.35}51.20%{opacity:1}75.00%{opacity:1}76.20%{opacity:0.35}100.00%{opacity:0.35}}#r4{animation:l4 22.0s linear infinite}@keyframes l4{0%{opacity:0.35}1.20%{opacity:0.35}25.00%{opacity:0.35}26.20%{opacity:0.35}50.00%{opacity:0.35}51.20%{opacity:1}75.00%{opacity:1}76.20%{opacity:0.35}100.00%{opacity:0.35}}#c0{animation:c0 22.0s linear infinite}@keyframes c0{0%{opacity:0}1.20%{opacity:1}25.00%{opacity:1}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:0}100.00%{opacity:0}}#c1{animation:c1 22.0s linear infinite}@keyframes c1{0%{opacity:0}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:1}50.00%{opacity:1}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:0}100.00%{opacity:0}}#c2{animation:c2 22.0s linear infinite}@keyframes c2{0%{opacity:0}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:1}75.00%{opacity:1}76.20%{opacity:0}100.00%{opacity:0}}#c3{animation:c3 22.0s linear infinite}@keyframes c3{0%{opacity:1}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:1}100.00%{opacity:1}}</style><rect width="680" height="436" rx="12" fill="var(--bg)"/><text class="s" x="20" y="22" text-anchor="start" dominant-baseline="central">label_failure: проверки идут сверху вниз, первая сработавшая даёт метку</text><path class="a" marker-end="url(#m)" d="M210 88V102"/><text class="s" x="222" y="95" text-anchor="start" dominant-baseline="central">нет</text><path class="a" marker-end="url(#m)" d="M210 150V164"/><text class="s" x="222" y="157" text-anchor="start" dominant-baseline="central">нет</text><path class="a" marker-end="url(#m)" d="M210 212V226"/><text class="s" x="222" y="219" text-anchor="start" dominant-baseline="central">нет</text><path class="a" marker-end="url(#m)" d="M210 274V288"/><text class="s" x="222" y="281" text-anchor="start" dominant-baseline="central">нет</text><g id="r0"><rect x="20" y="40" width="380" height="48" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="c" x="210.0" y="64.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Отказ или нет вывода агента?</text><rect x="440" y="40" width="220" height="48" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="550.0" y="54.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">refusal</text><text class="s" x="550.0" y="73.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">отказ, вывода нет</text><path class="a" marker-end="url(#m)" d="M400 64H436"/><text class="s" x="418" y="54" text-anchor="middle" dominant-baseline="central">да</text></g><g id="r1"><rect x="20" y="102" width="380" height="48" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="c" x="210.0" y="126.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Проверка действий пройдена?</text><rect x="440" y="102" width="220" height="48" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="550.0" y="116.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--teal3)">ok</text><text class="s" x="550.0" y="135.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--teal2)">провала нет</text><path class="a" marker-end="url(#m)" d="M400 126H436"/><text class="s" x="418" y="116" text-anchor="middle" dominant-baseline="central">да</text></g><g id="r2"><rect x="20" y="164" width="380" height="48" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="c" x="210.0" y="188.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Ни одно нужное событие не записано?</text><rect x="440" y="164" width="220" height="48" rx="8" fill="var(--amber)" stroke="var(--amber2)" stroke-width=".6"/><text class="h" x="550.0" y="178.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--amber3)">agent</text><text class="s" x="550.0" y="197.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--amber2)">событие не дошло до памяти</text><path class="a" marker-end="url(#m)" d="M400 188H436"/><text class="s" x="418" y="178" text-anchor="middle" dominant-baseline="central">да</text></g><g id="r3"><rect x="20" y="226" width="380" height="48" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="c" x="210.0" y="250.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Проверка контекста не пройдена?</text><rect x="440" y="226" width="220" height="48" rx="8" fill="var(--coral)" stroke="var(--coral2)" stroke-width=".6"/><text class="h" x="550.0" y="240.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--coral3)">memory</text><text class="s" x="550.0" y="259.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--coral2)">контекст не прошёл проверку</text><path class="a" marker-end="url(#m)" d="M400 250H436"/><text class="s" x="418" y="240" text-anchor="middle" dominant-baseline="central">да</text></g><g id="r4"><rect x="20" y="288" width="380" height="48" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="c" x="210.0" y="312.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Иначе</text><rect x="440" y="288" width="220" height="48" rx="8" fill="var(--purple)" stroke="var(--purple2)" stroke-width=".6"/><text class="h" x="550.0" y="302.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple3)">model</text><text class="s" x="550.0" y="321.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple2)">контекст прошёл проверку</text><path class="a" marker-end="url(#m)" d="M400 312H436"/><text class="s" x="418" y="302" text-anchor="middle" dominant-baseline="central">да</text></g><circle id="dot" r="7" fill="#d85a30"/><g id="c0"><text class="n" x="20" y="374">Шаг 1 из 4</text><text class="c" x="20" y="396">Метка выводится по цепочке в порядке кода. Отказ или пустой вывод даёт refusal,</text><text class="c" x="20" y="416">пройденная проверка действий даёт ok. Остальные случаи идут дальше.</text></g><g id="c1"><text class="n" x="20" y="374">Шаг 2 из 4</text><text class="c" x="20" y="396">Ни одно из нужных событий не записано: agent. Пример: ours, C6-eval-0002, cp-1:</text><text class="c" x="20" y="416">Worker вызвал update_record вместо чтения источника, события не записаны.</text></g><g id="c2"><text class="n" x="20" y="374">Шаг 3 из 4</text><text class="c" x="20" y="396">Контекст не прошёл проверку: memory. Пример: full_history, C1-eval-0000, cpx-1,</text><text class="c" x="20" y="416">в контексте оба значения. Иначе model. На C1 и C3 это по построению.</text></g><g id="c3"><text class="n" x="20" y="374">Шаг 4 из 4</text><text class="c" x="20" y="396">Предел: метка agent зависит от самой памяти. У ours она чаще, чем у full_history</text><text class="c" x="20" y="416">(33% и 11% на C6), причина не установлена. Один протокол её не объясняет.</text></g></svg>
