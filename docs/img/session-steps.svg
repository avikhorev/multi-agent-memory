nd="url(#m)" d="M115 318V264"/></g><g id="ar1"><path class="a" marker-end="url(#m)" d="M85 200V134"/></g><g id="ar3"><path class="a" marker-end="url(#m)" d="M255 200V134"/></g><g id="ar4"><path class="a" marker-end="url(#m)" d="M425 134V196"/><path class="a" marker-end="url(#m)" d="M320 92H356"/></g><g id="ar5"><path class="a" marker-end="url(#m)" d="M356 112H324"/></g><g id="ar6"><path class="a" marker-end="url(#m)" d="M595 200V134"/></g><g id="d1"><path class="d" marker-end="url(#md)" d="M105 74V46H235V70"/><text class="s" x="170" y="36" text-anchor="middle" dominant-baseline="central" style="fill:var(--dir)">Worker task</text></g><g id="d2"><path class="d" marker-end="url(#md)" d="M280 74V46H570V70"/><text class="s" x="425" y="36" text-anchor="middle" dominant-baseline="central" style="fill:var(--dir)">Worker's reply becomes the Reviewer's task</text></g><g id="lt"><text class="s" x="340" y="146" text-anchor="middle" dominant-baseline="central" style="fill:var(--dir)">TOOL RESULT</text></g><g id="ln"><text class="s" x="435" y="170" text-anchor="start" dominant-baseline="central">source, untrusted</text></g><circle id="dot" r="7" fill="#d85a30"/><g id="c0"><text class="n" x="20" y="408">Step 1 of 9</text><text class="c" x="20" y="430">User messages and part of the scenario notes are written to memory</text><text class="c" x="20" y="450">before the first agent call.</text></g><g id="c1"><text class="n" x="20" y="408">Step 2 of 9</text><text class="c" x="20" y="430">Planner reads memory and answers. Its answer then goes to the Worker's task,</text><text class="c" x="20" y="450">and not into memory.</text></g><g id="c2"><text class="n" x="20" y="408">Step 3 of 9</text><text class="c" x="20" y="430">Planner's answer becomes the Worker's task directly unless the scenario sets its own.</text><text class="c" x="20" y="450">This is the first path around memory. The Worker's context is read once.</text></g><g id="c3"><text class="n" x="20" y="408">Step 4 of 9</text><text class="c" x="20" y="430">First Worker call: it chooses one action, for example read_document.</text><text class="c" x="20" y="450">It gets the same memory context that it will get in the second call too.</text></g><g id="c4"><text class="n" x="20" y="408">Step 5 of 9</text><text class="c" x="20" y="430">The loop calls the Simulator, and the source text is written to memory as untrusted.</text><text class="c" x="20" y="450">This happens only for read_document and read_status.</text></g><g id="c5"><text class="n" x="20" y="408">Step 6 of 9</text><text class="c" x="20" y="430">The second Worker call gets the same context and TOOL RESULT. The document reaches</text><text class="c" x="20" y="450">before it, bypassing memory, so it has not yet entered the context.</text></g><g id="c6"><text class="n" x="20" y="408">Step 7 of 9</text><text class="c" x="20" y="430">Reviewer reads memory. The Worker's reply reaches it directly in the task,</text><text class="c" x="20" y="450">unless the scenario sets a Reviewer task. This is the second path around memory.</text></g><g id="c7"><text class="n" x="20" y="408">Step 8 of 9</text><text class="c" x="20" y="430">The evaluator checks the answers and contexts of this session's checkpoints</text><text class="c" x="20" y="450">and assigns failure labels.</text></g><g id="c8"><text class="n" x="20" y="408">Step 9 of 9</text><text class="c" x="20" y="430">end_session: ours extracts facts from the records of the closed session.</text><text class="c" x="20" y="450">Until this point, new records are not visible to ours as facts.</text></g></svg>
