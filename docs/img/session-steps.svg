arker-end="url(#m)" d="M115 318V264"/></g><g id="ar1"><path class="a" marker-end="url(#m)" d="M85 200V134"/></g><g id="ar3"><path class="a" marker-end="url(#m)" d="M255 200V134"/></g><g id="ar4"><path class="a" marker-end="url(#m)" d="M425 134V196"/><path class="a" marker-end="url(#m)" d="M320 92H356"/></g><g id="ar5"><path class="a" marker-end="url(#m)" d="M356 112H324"/></g><g id="ar6"><path class="a" marker-end="url(#m)" d="M595 200V134"/></g><g id="d1"><path class="d" marker-end="url(#md)" d="M105 74V46H235V70"/><text class="s" x="170" y="36" text-anchor="middle" dominant-baseline="central" style="fill:var(--dir)">задача Worker</text></g><g id="d2"><path class="d" marker-end="url(#md)" d="M280 74V46H570V70"/><text class="s" x="425" y="36" text-anchor="middle" dominant-baseline="central" style="fill:var(--dir)">ответ Worker становится задачей Reviewer</text></g><g id="lt"><text class="s" x="340" y="146" text-anchor="middle" dominant-baseline="central" style="fill:var(--dir)">TOOL RESULT</text></g><g id="ln"><text class="s" x="435" y="170" text-anchor="start" dominant-baseline="central">источник, untrusted</text></g><circle id="dot" r="7" fill="#d85a30"/><g id="c0"><text class="n" x="20" y="408">Шаг 1 из 9</text><text class="c" x="20" y="430">Сообщения пользователя и часть заметок сценария записываются в память</text><text class="c" x="20" y="450">до вызова первого агента.</text></g><g id="c1"><text class="n" x="20" y="408">Шаг 2 из 9</text><text class="c" x="20" y="430">Planner читает память и отвечает. Его ответ дальше идёт в задачу Worker,</text><text class="c" x="20" y="450">а не в память.</text></g><g id="c2"><text class="n" x="20" y="408">Шаг 3 из 9</text><text class="c" x="20" y="430">Ответ Planner становится задачей Worker напрямую, если сценарий не задаёт свою.</text><text class="c" x="20" y="450">Это первый путь мимо памяти. Контекст для Worker читается один раз.</text></g><g id="c3"><text class="n" x="20" y="408">Шаг 4 из 9</text><text class="c" x="20" y="430">Первый вызов Worker: он выбирает одно действие, например read_document.</text><text class="c" x="20" y="450">Контекст из памяти он получает тот же, что получит и во втором вызове.</text></g><g id="c4"><text class="n" x="20" y="408">Шаг 5 из 9</text><text class="c" x="20" y="430">Цикл вызывает Simulator, и текст источника пишется в память как untrusted.</text><text class="c" x="20" y="450">Это происходит только для read_document и read_status.</text></g><g id="c5"><text class="n" x="20" y="408">Шаг 6 из 9</text><text class="c" x="20" y="430">Второй вызов Worker получает тот же контекст и TOOL RESULT. Документ доходит</text><text class="c" x="20" y="450">до него мимо памяти, поэтому в контекст он ещё не попал.</text></g><g id="c6"><text class="n" x="20" y="408">Шаг 7 из 9</text><text class="c" x="20" y="430">Reviewer читает память. Ответ Worker приходит ему напрямую в задаче,</text><text class="c" x="20" y="450">если сценарий не задаёт задачу Reviewer. Это второй путь мимо памяти.</text></g><g id="c7"><text class="n" x="20" y="408">Шаг 8 из 9</text><text class="c" x="20" y="430">Оценщик проверяет ответы и контексты контрольных точек этой сессии</text><text class="c" x="20" y="450">и ставит метки провалов.</text></g><g id="c8"><text class="n" x="20" y="408">Шаг 9 из 9</text><text class="c" x="20" y="430">end_session: ours извлекает факты из записей закрытой сессии.</text><text class="c" x="20" y="450">До этого момента новые записи для ours не видны как факты.</text></g></svg>
