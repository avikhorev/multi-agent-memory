<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" width="680" height="296" role="img" aria-label="Анимация: четыре случая разрешения конфликта версий одного факта"><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="md" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#d85a30" stroke-width="1.5" stroke-linecap="round"/></marker></defs><style>:root{--bg:#fff;--line:#73726c;--t:#1f1e1d;--s:#5f5e5a;--gray:#f1efe8;--gray2:#5f5e5a;--gray3:#444441;--teal:#e1f5ee;--teal2:#0f6e56;--teal3:#085041;--amber:#faeeda;--amber2:#854f0b;--amber3:#633806;--purple:#eeedfe;--purple2:#534ab7;--purple3:#3c3489;--coral:#faece7;--coral2:#993c1d;--coral3:#712b13;--dir:#d85a30}@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--line:#9c9a92;--t:#f4f3ee;--s:#c2c0b6;--gray:#444441;--gray2:#b4b2a9;--gray3:#f1efe8;--teal:#085041;--teal2:#5dcaa5;--teal3:#e1f5ee;--amber:#633806;--amber2:#ef9f27;--amber3:#faeeda;--purple:#3c3489;--purple2:#afa9ec;--purple3:#eeedfe;--coral:#712b13;--coral2:#f0997b;--coral3:#faece7;--dir:#f0997b}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--t)}.a{stroke:var(--line);stroke-width:1.2;fill:none}.d{stroke:var(--dir);stroke-width:2;fill:none;stroke-dasharray:6 4}.h{font-size:14px;font-weight:600}.s{font-size:12px;fill:var(--s)}.c{font-size:14px}.n{font-size:12px;fill:var(--s)}.q{font-size:12px}#dot{animation:d 22.0s ease-in-out infinite}@keyframes d{0%{transform:translate(480px,132.0px)}2.50%{transform:translate(480px,132.0px)}25.00%{transform:translate(480px,132.0px)}27.50%{transform:translate(480px,132.0px)}50.00%{transform:translate(480px,132.0px)}52.50%{transform:translate(480px,132.0px)}75.00%{transform:translate(480px,132.0px)}77.50%{transform:translate(480px,132.0px)}97.50%{transform:translate(480px,132.0px)}100%{transform:translate(480px,132.0px)}}#k0{animation:l0 22.0s linear infinite}@keyframes l0{0%{opacity:0}1.20%{opacity:1}25.00%{opacity:1}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:0}100.00%{opacity:0}}#k1{animation:l1 22.0s linear infinite}@keyframes l1{0%{opacity:0}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:1}50.00%{opacity:1}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:0}100.00%{opacity:0}}#k2{animation:l2 22.0s linear infinite}@keyframes l2{0%{opacity:0}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:1}75.00%{opacity:1}76.20%{opacity:0}100.00%{opacity:0}}#k3{animation:l3 22.0s linear infinite}@keyframes l3{0%{opacity:1}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:1}100.00%{opacity:1}}#c0{animation:c0 22.0s linear infinite}@keyframes c0{0%{opacity:0}1.20%{opacity:1}25.00%{opacity:1}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:0}100.00%{opacity:0}}#c1{animation:c1 22.0s linear infinite}@keyframes c1{0%{opacity:0}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:1}50.00%{opacity:1}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:0}100.00%{opacity:0}}#c2{animation:c2 22.0s linear infinite}@keyframes c2{0%{opacity:0}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:1}75.00%{opacity:1}76.20%{opacity:0}100.00%{opacity:0}}#c3{animation:c3 22.0s linear infinite}@keyframes c3{0%{opacity:1}1.20%{opacity:0}25.00%{opacity:0}26.20%{opacity:0}50.00%{opacity:0}51.20%{opacity:0}75.00%{opacity:0}76.20%{opacity:1}100.00%{opacity:1}}</style><rect width="680" height="296" rx="12" fill="var(--bg)"/><text class="n" x="20" y="30" text-anchor="start" dominant-baseline="central">Атрибут: бюджет модуля search, в долларах. Значения придуманы для примера.</text><text class="s" x="115" y="62" text-anchor="middle" dominant-baseline="central">Действует сейчас</text><text class="s" x="345" y="62" text-anchor="middle" dominant-baseline="central">Приходит версия</text><text class="s" x="570" y="62" text-anchor="middle" dominant-baseline="central">Решение _resolve</text><path class="a" marker-end="url(#m)" d="M210 132H246"/><path class="a" marker-end="url(#m)" d="M440 132H476"/><g id="k0"><text class="h" x="20" y="48" text-anchor="start" dominant-baseline="central">Случай а: событие новее</text><rect x="20" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="115.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">500000</text><text class="s" x="115.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">событие: день 10</text><text class="s" x="115.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">user, доверенный</text><rect x="250" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="345.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">650000</text><text class="s" x="345.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">событие: день 12</text><text class="s" x="345.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">user, доверенный</text><rect x="480" y="76" width="180" height="112" rx="8" fill="var(--teal)" stroke="var(--teal2)" stroke-width=".6"/><text class="h" x="570.0" y="110.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--teal3)">Заменить</text><text class="s" x="570.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--teal2)">later_event</text><text class="s" x="570.0" y="154.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--teal2)">остаётся 650000</text></g><g id="k1"><text class="h" x="20" y="48" text-anchor="start" dominant-baseline="central">Случай б: недоверенная версия</text><rect x="20" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="115.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">500000</text><text class="s" x="115.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">событие: день 10</text><text class="s" x="115.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">user, доверенный</text><rect x="250" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="345.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">900000</text><text class="s" x="345.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">событие: день 12</text><text class="s" x="345.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">документ, untrusted</text><rect x="480" y="76" width="180" height="112" rx="8" fill="var(--coral)" stroke="var(--coral2)" stroke-width=".6"/><text class="h" x="570.0" y="102.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--coral3)">Отклонить</text><text class="s" x="570.0" y="122.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--coral2)">untrusted не меняет</text><text class="s" x="570.0" y="142.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--coral2)">доверенный факт</text><text class="s" x="570.0" y="162.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--coral2)">остаётся 500000</text></g><g id="k2"><text class="h" x="20" y="48" text-anchor="start" dominant-baseline="central">Случай в: старое событие или равное время</text><rect x="20" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="115.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">500000</text><text class="s" x="115.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">событие: день 10</text><text class="s" x="115.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">agent, авторитет 0</text><rect x="250" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="345.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">Две версии от user</text><text class="s" x="345.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">А: 400000, день 8</text><text class="s" x="345.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">Б: 650000, день 10</text><rect x="480" y="76" width="180" height="112" rx="8" fill="var(--amber)" stroke="var(--amber2)" stroke-width=".6"/><text class="s" x="570.0" y="110.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--amber2)">А: older event, отказ</text><text class="s" x="570.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--amber2)">Б: authority 3 &gt; 0</text><text class="s" x="570.0" y="154.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--amber2)">Б заменяет: 650000</text></g><g id="k3"><text class="h" x="20" y="48" text-anchor="start" dominant-baseline="central">Случай г: время и авторитет равны</text><rect x="20" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="115.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">500000</text><text class="s" x="115.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">событие: день 10</text><text class="s" x="115.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">user, доверенный</text><rect x="250" y="76" width="190" height="112" rx="8" fill="var(--gray)" stroke="var(--gray2)" stroke-width=".6"/><text class="h" x="345.0" y="112.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray3)">520000</text><text class="s" x="345.0" y="132.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">событие: день 10</text><text class="s" x="345.0" y="152.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--gray2)">user, доверенный</text><rect x="480" y="76" width="180" height="112" rx="8" fill="var(--purple)" stroke="var(--purple2)" stroke-width=".6"/><text class="h" x="570.0" y="102.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple3)">Оставить оба</text><text class="s" x="570.0" y="122.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple2)">500000 (per user)</text><text class="s" x="570.0" y="142.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple2)">520000 (per user)</text><text class="s" x="570.0" y="162.0" text-anchor="middle" dominant-baseline="central" style="fill:var(--purple2)">[DISPUTED]</text></g><circle id="dot" r="7" fill="#d85a30"/><g id="c0"><text class="n" x="20" y="234">Шаг 1 из 4</text><text class="c" x="20" y="256">Версия на день 12 новее версии на день 10: later_event, значение заменяется.</text><text class="c" x="20" y="276">Значения в примере придуманы, в коде сравниваются время события и доверие.</text></g><g id="c1"><text class="n" x="20" y="234">Шаг 2 из 4</text><text class="c" x="20" y="256">Недоверенный документ не заменяет доверенный факт, даже если он новее.</text><text class="c" x="20" y="276">Эта проверка стоит раньше сравнения времени.</text></g><g id="c2"><text class="n" x="20" y="234">Шаг 3 из 4</text><text class="c" x="20" y="256">Событие старше действующего отклоняется. При равном времени побеждает авторитет:</text><text class="c" x="20" y="276">user 3 выше agent 0. Порядок авторитета: user 3, tool 2, document 1, agent 0.</text></g><g id="c3"><text class="n" x="20" y="234">Шаг 4 из 4</text><text class="c" x="20" y="256">Время и авторитет равны: остаются оба значения, в контексте их помечает DISPUTED.</text><text class="c" x="20" y="276">Выбор между ними делает читатель, система его не угадывает.</text></g></svg>
